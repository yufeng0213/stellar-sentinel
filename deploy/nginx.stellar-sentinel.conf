# /etc/nginx/conf.d/stellar-sentinel.conf
# 域名根路径已有别的站点时，把 /stellar-sentinel/ 反向代理到本容器。
# 容器监听 127.0.0.1:3003；建议只绑定回环地址，由 Nginx 对外提供 HTTPS。

upstream stellar_sentinel_backend {
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # 如果已经有 80 -> 443 的跳转，把这一段删掉
    # return 301 https://$host$request_uri;

    client_max_body_size 4m;

    location = /stellar-sentinel {
        return 301 /stellar-sentinel/;
    }

    location /stellar-sentinel/ {
        proxy_pass http://stellar_sentinel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式对话：不要缓冲，不要缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
