        ${ATTRS.map((a) => `<div><span>${a.name}</span><b>${pv.attrs[a.key]}</b></div>`).join('')}
      </div>
    </div>
    <div>
      <div class="sum-row"><span>信息素签名</span><b>${abo.scent}</b></div>
      <div class="sum-row"><span>生命 / 精神</span><b>${pv.hpMax} / ${pv.mentalMax}</b></div>
      <div class="sum-row"><span>信用点</span><b>${pv.credits}</b></div>
      <div class="sum-row"><span>起始物资</span><b></b></div>
      <div class="sum-items">
        ${Object.keys(pv.items).map((k) => `<span class="tag">${ITEMS[k].name} ×${pv.items[k]}</span>`).join('')}
        ${d.traits.map((k) => `<span class="tag jade">${TRAITS[k].name}</span>`).join('')}
      </div>
    </div>
  </div>
</div>`;
}

function stepHTML(i) {
  if (i === 0) return stepIdentity();
  if (i === 1) return stepPath();
  if (i === 2) return stepAttrs();
  return stepTraits();
}

function renderMiniProfile() {
  const abo = ABOS[draft.abo];
  const role = ROLES[draft.role];
  const origin = ORIGINS[draft.origin];
  return `
    <div class="mini-profile">
      <span class="kicker">DRAFT</span>
      <span class="tag amber">${abo.code} ${abo.name}</span>
      <span class="tag cyan">${role.name}</span>
      <span class="tag">${origin.name}</span>
      <span class="tag jade">${pointsLeft(draft)} 点可用</span>
    </div>`;
}

function renderCreate() {
  $('#wizard-steps').innerHTML = STEPS.map((s, i) => `
    <span class="wstep ${i < ui.step ? 'is-done' : ''} ${i === ui.step ? 'is-on' : ''}" data-num="${String(i + 1).padStart(2, '0')}">
      <span class="wstep-text">${String(i + 1).padStart(2, '0')} ${s.title}</span>
    </span>`).join('');
  $('#wizard-progress').style.width = `${((ui.step + 1) / STEPS.length) * 100}%`;

  const body = $('#wizard-body');
  body.innerHTML = stepHTML(ui.step) + (ui.step < 3 ? renderMiniProfile() : '');
  body.scrollTop = 0;
  updateWizardFoot();

  const hasSave = !!loadSaved();
  $('#resume-btn').classList.toggle('hidden', !hasSave);
}

function updateWizardFoot() {
  const last = ui.step === STEPS.length - 1;
  const left = pointsLeft(draft);
  const need = 2 - draft.traits.length;
  const btn = $('#next-btn');
  const prev = $('#prev-btn');
  const hint = $('#wizard-hint');
  if (!btn || !prev || !hint) return;

  prev.disabled = ui.step === 0;
  const valid = left === 0 && need === 0;
  btn.disabled = last && !valid;
  btn.textContent = last
    ? (left > 0 ? `还有 ${left} 点属性` : need > 0 ? `请选择 ${need} 项特质` : '进入星区')
    : '下一步';

  const hints = [
    '第二性别只影响倾向，不限制路线。',
    '职业决定采集与安抚的专长。',
    left > 0 ? `还剩 ${left} 点属性未分配` : '属性已分配完毕。',
    need > 0 ? `还需选择 ${need} 项特质` : '准备完毕，可以进入星区。',
  ];
  hint.textContent = hints[ui.step] || '';
}

function nextStep() {
  if (ui.step === STEPS.length - 1) {
    if (pointsLeft(draft) > 0) return toast('还有属性点未分配');
    if (draft.traits.length !== 2) return toast('请选择 2 项特质');
    startGame();
    return;
  }
  ui.step += 1;
  renderCreate();
}

function prevStep() {
  if (ui.step === 0) return;
  ui.step -= 1;
  renderCreate();
}

function randomizeBuild() {
  draft.name = pick(NAMES);
  draft.abo = pick(['alpha', 'beta', 'omega']);
  draft.role = pick(['sentinel', 'guide']);
  draft.origin = pick(['colonist', 'cadet', 'broker', 'survivor']);
  draft.attrs = ATTRS.reduce((m, a) => (m[a.key] = BASE_ATTR, m), {});
  let left = FREE_POINTS;
  while (left > 0) {
    const pool = ATTRS.filter((a) => draft.attrs[a.key] < ATTR_MAX);
    const a = pick(pool);
    draft.attrs[a.key] += 1;
    left -= 1;
  }
  const keys = Object.keys(TRAITS);
  draft.traits = [pick(keys), pick(keys.filter((k) => k !== draft.traits[0]))];
  ui.step = STEPS.length - 1;
  renderCreate();
  toast('已生成一套随机开局', 'good');
}

/* ============================================================
 * 5. 建号 / 存档
 * ========================================================== */
function buildGame(d) {
  const attrs = finalAttrs(d);
  const abo = ABOS[d.abo];
  const role = ROLES[d.role];
  const origin = ORIGINS[d.origin];
  const hpMax = 50 + attrs.vit * 6;
  const mentalMax = 100 + attrs.psi * 2 + abo.mental + role.mental;

  const game = {
    version: 2,
    player: {
      name: d.name.trim() || '无名者',
      abo: d.abo, role: d.role, origin: d.origin,
      traits: [...d.traits],
      attrs,
      hp: hpMax, hpMax,
      mental: mentalMax, mentalMax,
      credits: origin.credits,
    },
    day: 1,
    ap: 8,
    apMax: 8,
    location: 'dock',
    inv: { ...origin.items },
    gear: [],
    equipment: { weapon: null, head: null, body: null, hands: null, trinket: null },
    nodeUse: {},
    log: [],
    chats: {},
    affinity: { magpie: 10, yeka: 5, echo: 0 },
    quest: null,
    flags: { discount: false },
  };

  Object.keys(NPCS).forEach((id) => {
    game.chats[id] = [{ from: 'npc', text: NPCS[id].greet }];
  });
  return game;
}

function addLog(text, kind = 'info') {
  if (!S) return;
  S.log.unshift({ t: `D${S.day} · ${timeLabel()}`, text, kind });
  if (S.log.length > 160) S.log = S.log.slice(0, 160);
}

function timeLabel() {
  const ap = S ? S.ap : 8;
  if (ap >= 6) return '晨间';
  if (ap >= 4) return '午后';
  if (ap >= 2) return '黄昏';
  return '深夜';
}

function isNight() { return timeLabel() === '深夜'; }

function saveGame(silent = false) {
  if (!S) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    if (!silent) { flashSave(); toast('已存档', 'good'); }
  } catch (e) {
    toast('存档失败：浏览器存储不可用', 'bad');
  }
}

function autosave() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 忽略 */ }
}

let flashTimer = null;
function flashSave() {
  const el = $('#save-hint');
  if (!el) return;
  el.textContent = '已保存';
  el.classList.add('flash');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    el.textContent = '自动存档';
    el.classList.remove('flash');
  }, 1600);
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return data && data.player ? data : null;
  } catch (e) { return null; }
}

function normalize(data) {
  data.log = data.log || [];
  data.chats = data.chats || {};
  Object.keys(NPCS).forEach((id) => {
    if (!data.chats[id]) data.chats[id] = [{ from: 'npc', text: NPCS[id].greet }];
  });
  data.affinity = data.affinity || { magpie: 10, yeka: 5, echo: 0 };
  data.gear = data.gear || [];
  data.inv = data.inv || {};
  data.equipment = data.equipment || { weapon: null, head: null, body: null, hands: null, trinket: null };
  data.nodeUse = data.nodeUse || {};
  data.flags = data.flags || {};
  data.quest = data.quest || null;
  data.apMax = data.apMax || 8;
  return data;
}

function showCreate() {
  closeMap();
  draft = newDraft();
  ui.step = 0;
  $('#game').classList.add('hidden');
  $('#create').classList.remove('hidden');
  renderCreate();
}

function startGame() {
  if (pointsLeft(draft) > 0) return toast('还有属性点未分配');
  if (draft.traits.length !== 2) return toast('请选择 2 项特质');

  S = buildGame(draft);
  addLog(`${S.player.name}，${ABOS[S.player.abo].name} · ${ROLES[S.player.role].name}。你在空港的冷冻舱里醒来。`, 'story');
  addLog('白塔仍然沉默。通讯频道里只有静电，和一个反复出现的坐标。', 'story');

  ui.view = 'explore';
  ui.midTab = 'explore';
  ui.sideTab = 'log';
  ui.chatNpc = 'magpie';

  $('#create').classList.add('hidden');
  $('#game').classList.remove('hidden');
  renderAll();
  saveGame(true);
  flashSave();
}

function resumeGame() {
  const saved = loadSaved();
  if (!saved) return toast('没有找到存档', 'bad');
  S = normalize(saved);
  ui.view = 'explore';
  ui.midTab = 'explore';
  ui.sideTab = 'log';
  ui.chatNpc = 'magpie';
  $('#create').classList.add('hidden');
  $('#game').classList.remove('hidden');
  renderAll();
  toast('读取存档', 'good');
}

/* ============================================================
 * 6. 派生数值
 * ========================================================== */
function hasTrait(key) { return S.player.traits.includes(key); }

function gearBonus(attrKey) {
  let sum = 0;
  Object.keys(S.equipment).forEach((slot) => {
    const uid = S.equipment[slot];
    if (!uid) return;
    const g = S.gear.find((x) => x.uid === uid);
    if (g) sum += g.bonus[attrKey] || 0;
  });
  return sum;
}

function attrTotal(attrKey) { return S.player.attrs[attrKey] + gearBonus(attrKey); }
function attrEff(attrKey) { return attrTotal(attrKey) + (S.player.mental < 30 ? -2 : 0); }

function nightMod() {
  if (!isNight()) return 0;
  return hasTrait('night') ? 1 : -1;
}

function traitBonus(kind) {
  let b = 0;
  if (kind === 'gather' && hasTrait('nose')) b += 1;
  if (kind === 'forge' && hasTrait('hands')) b += 1;
  if (kind === 'social' && hasTrait('dealer')) b += 1;
  return b;
}

function roleBoost(kind) {
  if (kind === 'gather' && ROLES[S.player.role].gather) return 1;
  if (kind === 'psi' && ROLES[S.player.role].psiCheck) return 1;
  return 0;
}

function addItem(key, n = 1) { S.inv[key] = (S.inv[key] || 0) + n; }

function takeItem(key, n = 1) {
  if ((S.inv[key] || 0) < n) return false;
  S.inv[key] -= n;
  if (S.inv[key] <= 0) delete S.inv[key];
  return true;
}

function qtyOf(y) {
  if (Array.isArray(y.qty)) {
    return y.qty[0] === y.qty[1] ? y.qty[0] : y.qty[0] + randInt(y.qty[1] - y.qty[0] + 1);
  }
  return y.qty;
}

function bonusText(bonus) {
  return Object.keys(bonus).filter((k) => bonus[k]).map((k) => `${ATTR_NAME[k]}+${bonus[k]}`).join(' ');
}

/* ============================================================
 * 7. 判定
 * ========================================================== */
function rollCheck(label, attrKey, dc, bonus = 0) {
  const roll = d20();
  const attr = attrEff(attrKey);
  const total = roll + attr + bonus;
  const crit = roll === 20;
  const fumble = roll === 1;
  const success = crit || (!fumble && total >= dc);
  const bonusText = bonus ? (bonus > 0 ? ` +${bonus}` : ` ${bonus}`) : '';
  addLog(
    `${label}｜${ATTR_NAME[attrKey]} d20(${roll}) + ${attr}${bonusText} = ${total}｜DC ${dc} → ${success ? '成功' : '失败'}${crit ? '（大成功）' : fumble ? '（大失败）' : ''}`,
    success ? 'good' : 'bad'
  );
  return { roll, attr, total, crit, fumble, success };
}

/* ============================================================
 * 8. 行动：采集 / 移动 / 休整
 * ========================================================== */
function gather(mapId, nodeId) {
  if (!S) return;
  const map = MAPS.find((m) => m.id === mapId);
  const node = map && map.nodes.find((n) => n.id === nodeId);
  if (!map || !node) return;
  if (S.location !== mapId) return toast('你不在这个区域');
  if (S.ap < 1) return toast('行动点不足，回空港休整');
  if (S.player.mental <= 0) return toast('精神已经崩了，先休整');

  const key = `${mapId}:${nodeId}`;
  const used = S.nodeUse[key] || 0;
  if (used >= node.charges) return toast('这个节点今天已经空了');

  S.ap -= 1;
  S.nodeUse[key] = used + 1;

  const bonus = traitBonus('gather') + roleBoost('gather') + nightMod();
  const res = rollCheck(`采集 · ${node.name}`, node.attr, node.dc, bonus);

  const gains = {};
  if (res.success) {
    node.yields.forEach((y) => {
      if (y.chance && Math.random() > y.chance) return;
      const n = qtyOf(y);
      gains[y.item] = (gains[y.item] || 0) + n;
    });
  } else if (res.total >= node.dc - 3) {
    const y = node.yields[0];
    gains[y.item] = 1;
  }

  const gainList = Object.keys(gains);
  gainList.forEach((k) => addItem(k, gains[k]));
  if (gainList.length) {
    addLog(`获得 ${gainList.map((k) => `${ITEMS[k].name} ×${gains[k]}`).join('、')}。`, 'good');
  } else {
    addLog('只刮下一点尘土。', 'info');
  }

  const mental = node.mental != null ? node.mental : map.danger;
  if (mental > 0 && S.player.mental > 0) {
    const cost = Math.max(0, mental - (hasTrait('calm') ? 1 : 0));
    if (cost) {
      S.player.mental = clamp(S.player.mental - cost, 0, S.player.mentalMax);
      addLog(`精神稳定度 -${cost}。`, 'info');
    }
  }
  checkCollapse();

  renderAll();
  autosave();
}

function travel(mapId) {
  if (!S) return;
  if (S.location === mapId) { closeMap(); return toast('你已经在这里'); }
  const map = MAPS.find((m) => m.id === mapId);
  if (!map) return;

  const stranded = S.ap < 1;
  if (stranded && mapId !== 'dock') return toast('行动点不足');

  if (!stranded) S.ap -= 1;
  S.location = mapId;

  const toll = map.danger >= 3 ? 5 : map.danger >= 2 ? 2 : 0;
  if (toll) {
    S.player.mental = clamp(S.player.mental - toll, 0, S.player.mentalMax);
    addLog(`穿越 ${map.name} 的边界，精神稳定度 -${toll}。`, 'info');
  }
  if (stranded) {
    S.player.hp = Math.max(1, S.player.hp - 5);
    S.player.mental = clamp(S.player.mental - 8, 0, S.player.mentalMax);
    addLog('行动点耗尽。你几乎是爬回空港的。生命 -5，精神 -8。', 'bad');
  }
  addLog(`你抵达 ${map.name}。`, 'story');
  checkCollapse();

  closeMap();
  ui.view = 'explore';
  ui.midTab = 'explore';
  renderAll();
  autosave();
}

function rest() {
  if (!S) return;
  if (S.location !== 'dock') return toast('只能回白塔空港休整');

  S.day += 1;
  S.ap = S.apMax;
  S.nodeUse = {};
  S.player.hp = clamp(S.player.hp + Math.floor(S.player.hpMax * 0.4), 0, S.player.hpMax);
  S.player.mental = clamp(S.player.mental + 40, 0, S.player.mentalMax);

  addLog('你在空港的旧舱里睡了一觉。梦里有人在数你的心跳。', 'story');
  toast('新的一天。行动点已恢复。', 'good');
  renderAll();
  autosave();
}

function checkCollapse() {
  if (S.player.mental > 0) return;
  S.player.hp = Math.max(1, S.player.hp - 12);
  S.location = 'dock';
  S.day += 1;
  S.ap = S.apMax;
  S.nodeUse = {};
  S.player.mental = Math.floor(S.player.mentalMax * 0.35);
  S.player.hp = clamp(S.player.hp + Math.floor(S.player.hpMax * 0.2), 0, S.player.hpMax);
  addLog('精神图景崩解。你在空港的医疗舱里醒来，耳鸣了很久。', 'bad');
  toast('精神崩解：你被送回了空港', 'bad');
}

/* ============================================================
 * 9. 行动：锻造 / 装备 / 使用
 * ========================================================== */
function makeGear(key, quality) {
  const base = GEAR[key];
  const delta = quality === '精良' ? 1 : quality === '粗糙' ? -1 : 0;
  const bonus = {};
  Object.keys(base.bonus).forEach((k) => { bonus[k] = Math.max(0, base.bonus[k] + delta); });
  return {
    uid: `g${Date.now()}_${uidSeq++}`,
    key,
    name: base.name,
    slot: base.slot,
    bonus,
    quality,
    note: base.note,
  };
}

function hasMats(recipe) {
  return Object.keys(recipe.mats).every((k) => (S.inv[k] || 0) >= recipe.mats[k]);
}

function craft(recipeId) {
  if (!S) return;
  const r = RECIPES.find((x) => x.id === recipeId);
  if (!r) return;
  if (S.location !== 'dock') return toast('需要回到空港的锻炉');
  if (S.ap < 1) return toast('行动点不足');
  if (!hasMats(r)) return toast('材料不足');

  S.ap -= 1;
  Object.keys(r.mats).forEach((k) => takeItem(k, r.mats[k]));

  const bonus = traitBonus('forge') + nightMod();
  const res = rollCheck(`锻造 · ${r.name}`, 'tec', r.dc, bonus);

  if (!res.success) {
    addLog('淬火失败，材料在炉里耗尽了。', 'bad');
    toast('锻造失败', 'bad');
    renderAll();
    autosave();
    return;
  }

  const margin = res.total - r.dc;
  const quality = res.crit || margin >= 6 ? '精良' : margin >= 2 ? '标准' : '粗糙';

  if (r.type === 'use') {
    addItem(r.out, r.qty || 1);
    addLog(`锻造成功：${ITEMS[r.out].name} ×${r.qty || 1}（${quality}）。`, 'good');
  } else {
    const g = makeGear(r.out, quality);
    S.gear.push(g);
    if (!S.equipment[g.slot]) {
      S.equipment[g.slot] = g.uid;
      addLog(`锻造成功：${g.name}（${quality}），已装备。`, 'good');
    } else {
      addLog(`锻造成功：${g.name}（${quality}），已放入背包。`, 'good');
    }
  }
  toast('锻造成功', 'good');
  renderAll();
  autosave();
}

function toggleEquip(uid) {
  const g = S.gear.find((x) => x.uid === uid);
  if (!g) return;
  S.equipment[g.slot] = S.equipment[g.slot] === uid ? null : uid;
  renderAll();
  autosave();
}

function useItem(key) {
  const it = ITEMS[key];
  if (!it || !it.effect) return;
  if (!takeItem(key, 1)) return;
  const msg = [];
  if (it.effect.hp) {
    S.player.hp = clamp(S.player.hp + it.effect.hp, 0, S.player.hpMax);
    msg.push(`生命 +${it.effect.hp}`);
  }
  if (it.effect.mental) {
    S.player.mental = clamp(S.player.mental + it.effect.mental, 0, S.player.mentalMax);
    msg.push(`精神 +${it.effect.mental}`);
  }
  addLog(`使用 ${it.name}：${msg.join('，')}。`, 'good');
  renderAll();
  autosave();
}

/* ============================================================
 * 10. 渲染：外壳
 * ========================================================== */
function renderAll() {
  if (!S) return;
  renderHud();
  renderChar();
  renderMid();
  renderSide();
  renderBottomNav();
}

function renderHud() {
  $('#hud-day').textContent = S.day;
  $('#hud-time').textContent = timeLabel();
  $('#hud-credits').textContent = S.player.credits;
  const pips = [];
  for (let i = 0; i < S.apMax; i++) {
    const on = i < S.ap;
    pips.push(`<i class="${on ? (S.ap <= 2 ? 'on low' : 'on') : ''}"></i>`);
  }
  $('#hud-ap').innerHTML = pips.join('');
}

function renderBottomNav() {
  const shell = $('#game');
  shell.dataset.view = ui.view;
  $$('#bottom-nav button').forEach((b) => b.classList.toggle('is-on', b.dataset.view === ui.view));
}

function setView(view) {
  const prev = ui.view;
  ui.view = view;
  if (view === 'explore' || view === 'bag' || view === 'forge') {
    ui.midTab = view;
    renderMid();
  }
  if (view === 'comms') {
    if (prev !== 'comms') ui.sideTab = 'chat';
    renderSide();
  }
  renderBottomNav();
  animateView(view);
}

function animateView(view) {
  const el = view === 'comms' ? $('#side-content') : view === 'char' ? $('#char-panel') : $('#mid-content');
  if (!el) return;
  el.classList.remove('view-in');
  void el.offsetWidth;
  el.classList.add('view-in');
}

/* ============================================================
 * 11. 渲染：角色
 * ========================================================== */
function renderChar() {
  const p = S.player;
  const abo = ABOS[p.abo];
  const role = ROLES[p.role];
  const origin = ORIGINS[p.origin];
  const low = p.mental < 30;

  const status = [];
  if (low) status.push('<span class="tag red">精神疲惫 -2</span>');
  if (isNight()) status.push(`<span class="tag ${hasTrait('night') ? 'jade' : 'red'}">${hasTrait('night') ? '夜行 +1' : '夜间 -1'}</span>`);
  if (p.mental >= 90) status.push('<span class="tag cyan">图景清明</span>');
  if (S.quest) status.push(`<span class="tag amber">委托：${esc(S.quest.name)}</span>`);

  const slots = Object.keys(SLOTS).map((slot) => {
    const uid = S.equipment[slot];
    const g = uid ? S.gear.find((x) => x.uid === uid) : null;
    return `<button type="button" class="gslot ${g ? 'is-filled' : ''}" ${g ? `data-act="equip" data-uid="${g.uid}"` : 'disabled'}
      title="${g ? esc(g.note) : `${SLOTS[slot]}：空`}">
      <span class="gs-ico">${g ? GEAR_GLYPH[g.key] || '·' : '·'}</span>
      <span class="gs-name">${g ? esc(g.name) : '空'}</span>
      <span class="gs-slot">${SLOTS[slot]}</span>
    </button>`;
  }).join('');

  $('#char-panel').innerHTML = `
    <div class="char-head">
      <div class="char-ava">${esc(p.name.slice(0, 1))}<span class="abo-badge">${abo.code}</span></div>
      <div class="char-id">
        <b>${esc(p.name)}</b>
        <p>${abo.name} · ${role.name} · ${origin.name}</p>
      </div>
    </div>

    <div class="char-tags">
      <span class="tag amber">${abo.scent}</span>
      ${p.traits.map((k) => `<span class="tag jade">${TRAITS[k].name}</span>`).join('')}
    </div>

    <div class="vitals">
      <div>
        <div class="vital-head"><span>生命</span><b>${Math.round(p.hp)} / ${p.hpMax}</b></div>
        <div class="bar hp"><i style="width:${clamp(p.hp / p.hpMax * 100, 0, 100)}%"></i></div>
      </div>
      <div>
        <div class="vital-head"><span>精神稳定</span><b>${Math.round(p.mental)} / ${p.mentalMax}</b></div>
        <div class="bar mental ${low ? 'low' : ''}"><i style="width:${clamp(p.mental / p.mentalMax * 100, 0, 100)}%"></i></div>
      </div>
    </div>

    <h3 class="mini-label">属性 <em>AP ${S.ap} / ${S.apMax}</em></h3>
    <div class="attr-list">
      ${ATTRS.map((a) => {
        const total = attrTotal(a.key);
        const bonus = total - p.attrs[a.key];
        return `<div class="attr-row">
          <span class="name">${a.name}</span>
          <span class="track"><i style="width:${clamp(total / 12 * 100, 6, 100)}%"></i></span>
          <b>${total}</b>
          <em>${bonus ? `+${bonus}` : ''}</em>
        </div>`;
      }).join('')}
    </div>

    <h3 class="mini-label">装备</h3>
    <div class="gslot-grid">${slots}</div>

    <h3 class="mini-label">状态</h3>
    <div class="status-list">${status.length ? status.join('') : '<span class="tag">稳定</span>'}</div>

    <div class="char-actions">
      <button type="button" class="btn btn-ghost btn-sm" data-act="save">存档</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="menu">回到标题</button>
    </div>`;
}

/* ============================================================
 * 12. 渲染：探索 / 背包 / 锻造
 * ========================================================== */
function renderMid() {
  $$('#mid-tabs button').forEach((b) => b.classList.toggle('is-on', b.dataset.tab === ui.midTab));
  const box = $('#mid-content');
  if (ui.midTab === 'bag') { box.innerHTML = renderBag(); return; }
  if (ui.midTab === 'forge') { box.innerHTML = renderForge(); return; }
  box.innerHTML = renderExplore();
}

function renderExplore() {
  const map = MAPS.find((m) => m.id === S.location);
  const atDock = map.id === 'dock';
  const danger = Array.from({ length: 3 }, (_, i) => `<i class="${i < map.danger ? 'on' : ''}"></i>`).join('');

  const leftTotal = map.nodes.reduce((sum, n) => sum + Math.max(0, n.charges - (S.nodeUse[`${map.id}:${n.id}`] || 0)), 0);
  const allTotal = map.nodes.reduce((sum, n) => sum + n.charges, 0);

  const nodes = map.nodes.map((n) => {
    const left = n.charges - (S.nodeUse[`${map.id}:${n.id}`] || 0);
    const mental = n.mental != null ? n.mental : map.danger;
    const cost = Math.max(0, mental - (hasTrait('calm') ? 1 : 0));
    return `
      <article class="node ${left <= 0 ? 'is-empty' : ''}">
        <div class="node-top">
          <span class="node-ico">${left > 0 ? '◆' : '◇'}</span>
          <span class="node-charge">${left}/${n.charges}</span>
        </div>
        <h3>${n.name}</h3>
        <div class="node-meta">
          <span>${ATTR_NAME[n.attr]}</span><b>DC ${n.dc}</b>${cost ? `<em>精神 -${cost}</em>` : ''}
        </div>
        <p class="node-yield">${n.yields.map((y) => ITEMS[y.item].name).join(' / ')}</p>
        <button type="button" class="btn btn-sm" data-act="gather" data-map="${map.id}" data-node="${n.id}"
          ${left <= 0 || S.ap < 1 ? 'disabled' : ''}>${left <= 0 ? '今日已空' : '采集'}</button>
      </article>`;
  }).join('');

  const stranded = S.ap < 1 && !atDock;
  const hint = atDock
    ? `<div class="hint-bar">空港可以休整：恢复精神与行动点，也让采集节点重新长出来。</div>`
    : stranded
      ? `<div class="hint-bar">行动点耗尽。可紧急撤回空港（生命 -5、精神 -8）。
          <button type="button" class="btn btn-sm" data-act="travel" data-map="dock">紧急撤离</button></div>`
      : `<div class="hint-bar">这里不能过夜。行动点耗尽前，记得回白塔空港。</div>`;

  return `
<section class="scene">
  <div class="map-art" style="--accent:${map.accent}">
    <div class="art-grid"></div>
    <div class="art-orb"></div>
    <div class="art-ring"></div>
    <div class="art-scan"></div>
    <div class="map-copy">
      <p class="kicker">${map.code} · ${atDock ? '安全区' : '边境星区'}</p>
      <h2>${map.name}</h2>
      <p class="map-desc">${map.desc}</p>
    </div>
    <button type="button" class="map-btn" data-act="open-map">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 15l4.5-9 5 9 4.5-9"/>
      </svg>星图
    </button>
    <div class="map-danger">
      <span>危险度</span>
      <span class="bars ${map.danger >= 3 ? 'high' : ''}">${danger}</span>
    </div>
  </div>

  <div class="scene-bar">
    <div class="scene-bar-left">
      <span class="chip">AP ${S.ap}/${S.apMax}</span>
      <span class="chip">节点 ${leftTotal}/${allTotal}</span>
      ${S.quest ? `<span class="chip amber">委托 · ${esc(S.quest.name)}</span>` : ''}
    </div>
    <button type="button" class="btn btn-sm" data-act="rest" ${atDock ? '' : 'disabled'}>${atDock ? '休整 · 次日' : '需回空港'}</button>
  </div>

  <div class="node-grid">${nodes}</div>
  ${hint}

  <div class="signal-card">
    <div class="signal-head">
      <span class="kicker">SIGNAL · ${map.code}</span>
      <span class="live"><i></i>LIVE</span>
    </div>
    <p>${map.signal}</p>
  </div>
</section>`;
}

function renderBag() {
  const mats = Object.keys(S.inv).filter((k) => ITEMS[k] && ITEMS[k].kind === 'mat' && S.inv[k] > 0);
  const uses = Object.keys(S.inv).filter((k) => ITEMS[k] && ITEMS[k].kind === 'use' && S.inv[k] > 0);

  const matHtml = mats.length
    ? `<div class="item-grid">${mats.map((k) => `
        <div class="item" title="${esc(ITEMS[k].note)}">
          <span class="i-glyph">${ITEMS[k].glyph}</span>
          <span class="i-body"><b>${ITEMS[k].name}</b><span>×${S.inv[k]}</span></span>
        </div>`).join('')}</div>`
    : `<div class="empty">还没有材料。去锈带废墟或深岩矿脉看看。</div>`;

  const useHtml = uses.length
    ? `<div class="item-grid">${uses.map((k) => `
        <div class="item" title="${esc(ITEMS[k].note)}">
          <span class="i-glyph use">${ITEMS[k].glyph}</span>
          <span class="i-body"><b>${ITEMS[k].name}</b><span>×${S.inv[k]}</span></span>
          <button type="button" class="i-use" data-act="use" data-key="${k}">使用</button>
        </div>`).join('')}</div>`
    : `<div class="empty">没有消耗品。</div>`;

  const gearHtml = S.gear.length
    ? `<div class="gear-list">${S.gear.map((g) => {
        const on = S.equipment[g.slot] === g.uid;
        return `
          <div class="gear ${on ? 'is-on' : ''}">
            <span class="g-glyph">${GEAR_GLYPH[g.key] || '·'}</span>
            <div class="g-body">
              <b>${esc(g.name)}</b><span class="q ${g.quality === '精良' ? 'q2' : g.quality === '粗糙' ? 'q0' : 'q1'}">${g.quality}</span>
              <p>${SLOTS[g.slot]} · ${esc(g.note)}</p>
            </div>
            <span class="g-bonus">${bonusText(g.bonus)}</span>
            <button type="button" class="btn btn-sm" data-act="equip" data-uid="${g.uid}">${on ? '卸下' : '装备'}</button>
          </div>`;
      }).join('')}</div>`
    : `<div class="empty">背包里没有打造好的装备。去锻造页试试。</div>`;

  return `
<section class="content">
  <div class="content-head">
    <div>
      <p class="kicker">INVENTORY</p>
      <h2>背包</h2>
      <p class="content-sub">材料 · 消耗品 · 装备</p>
    </div>
    <span class="chip">${mats.length + uses.length} 种物资</span>
  </div>

  <p class="sec-label">材料</p>
  ${matHtml}
  <p class="sec-label">消耗品</p>
  ${useHtml}
  <p class="sec-label">装备</p>
  ${gearHtml}
</section>`;
}

function renderForge() {
  const atForge = S.location === 'dock';

  const rows = RECIPES.map((r) => {
    const mats = Object.keys(r.mats).map((k) => {
      const need = r.mats[k];
      const have = S.inv[k] || 0;
      return `<span class="mat ${have >= need ? '' : 'lack'}">${ITEMS[k].name} ${have}/${need}</span>`;
    }).join('');
    return `
      <div class="recipe">
        <span class="r-glyph">⚒</span>
        <div class="r-body">
          <div class="r-top"><b>${r.name}</b><span>技艺 DC ${r.dc}</span></div>
          <div class="mats">${mats}</div>
        </div>
        <button type="button" class="btn btn-sm" data-act="craft" data-id="${r.id}"
          ${(!atForge || !hasMats(r) || S.ap < 1) ? 'disabled' : ''}>锻造</button>
      </div>`;
  }).join('');

  return `
<section class="content">
  <div class="content-head">
    <div>
      <p class="kicker">FORGE</p>
      <h2>锻造工坊</h2>
      <p class="content-sub">${atForge ? '旧锻炉在线 · 品质由技艺判定决定' : '需要回到白塔空港的旧锻炉'}</p>
    </div>
    <span class="chip">AP ${S.ap}/${S.apMax}</span>
  </div>

  <div class="recipe-list">${rows}</div>
  ${atForge ? '' : `<div class="hint-bar inline">锻造需要空港的旧锻炉。
    <button type="button" class="btn btn-sm" data-act="travel" data-map="dock">回空港</button></div>`}
</section>`;
}

/* ============================================================
 * 13. 渲染：日志 / 通讯
 * ========================================================== */
function renderSide() {
  const box = $('#side-content');
  const tabs = `
    <div class="side-tabs">
      <button type="button" data-act="side-tab" data-tab="log" class="${ui.sideTab === 'log' ? 'is-on' : ''}">日志</button>
      <button type="button" data-act="side-tab" data-tab="chat" class="${ui.sideTab === 'chat' ? 'is-on' : ''}">通讯</button>
    </div>`;
  box.innerHTML = tabs + `<div class="side-body">${ui.sideTab === 'log' ? renderLog() : renderChat()}</div>`;

  if (ui.sideTab === 'chat') {
    requestAnimationFrame(() => {
      const el = $('#chat-scroll');
      if (el) el.scrollTop = el.scrollHeight;
    });
  }
}

function renderLog() {
  const entries = S.log.length
    ? S.log.map((e) => `<div class="log-entry ${e.kind}">
        <div class="log-meta"><span>${e.t}</span><span>${e.kind === 'story' ? 'STORY' : e.kind === 'good' ? 'PASS' : e.kind === 'bad' ? 'FAIL' : 'SYS'}</span></div>
        <p>${esc(e.text)}</p>
      </div>`).join('')
    : `<div class="empty">还没有记录。做点什么。</div>`;
  return `<div class="log-scroll">${entries}</div>`;
}

function renderChat() {
  const id = ui.chatNpc;
  const npc = NPCS[id];
  const msgs = (S.chats[id] || []).map((m) => {
    if (m.from === 'note') return `<div class="msg note">${esc(m.text)}</div>`;
    return `<div class="msg ${m.from}">${esc(m.text)}</div>`;
  }).join('');

  const chips = Object.values(NPCS).map((n) => `
    <button type="button" class="npc-chip ${n.id === id ? 'is-on' : ''}" data-act="chat-npc" data-id="${n.id}">
      <i></i>${n.name}
    </button>`).join('');

  const quick = npc.actions.map((a) => `
    <button type="button" data-act="chat-act" data-id="${a.id}">${a.label}</button>`).join('');

  return `
    <div class="npc-picker">${chips}</div>
    <div class="npc-card">
      <span class="npc-ava">${esc(npc.name.slice(0, 1))}</span>
      <div class="npc-id">
        <b>${npc.name}</b>
        <span>${ABOS[npc.abo].name} · ${npc.title} · ${npc.where}</span>
      </div>
      <div class="npc-aff"><span>好感</span><b>${S.affinity[id] || 0}</b></div>
    </div>

    <div class="chat-scroll" id="chat-scroll">
      ${msgs}
      <details class="prompt">
        <summary>LLM 上下文预览（接入时发给模型的内容）</summary>
        <pre>${esc(buildPrompt(npc))}</pre>
      </details>
    </div>

    <div class="chat-foot">
      <div class="quick">${quick}</div>
      <div class="chat-input">
        <input id="chat-text" maxlength="120" placeholder="对${npc.name}说些什么…" autocomplete="off" />
        <button type="button" data-act="send-chat">发送</button>
      </div>
    </div>`;
}

/* ============================================================
 * 14. 通讯 / LLM 预留
 * ========================================================== */
function npcSay(npcId, text) {
  if (!S.chats[npcId]) S.chats[npcId] = [];
  S.chats[npcId].push({ from: 'npc', text });
}

function addAffinity(npcId, n) {
  S.affinity[npcId] = clamp((S.affinity[npcId] || 0) + n, 0, 100);
}

function replyFor(npc, text) {
  const aff = S.affinity[npc.id] || 0;

  if (npc.id === 'magpie') {
    if (/折扣|便宜|砍价|价格|多少钱|钱/.test(text)) {
      return aff >= 25 ? '“给你抹个零。别到处说。”' : '“先让我看见你的信用点，再谈价钱。”';
    }
    if (/材料|货|买|包/.test(text)) return '“星髓、冷晶、树脂，都有。整包还是零买？”';
    if (/白塔|哨兵|向导|失联/.test(text)) return '“白塔？上个月还在收税，这个月连尸体都没人收。你问我，我问谁。”';
    if (/裂谷|裂隙/.test(text)) return '“那边的结晶我收。但我不问来路，你也别说。”';
  }

  if (npc.id === 'yeka') {
    if (/委托|任务|活|干活|帮忙/.test(text)) return '“去黑曜裂谷，带一块裂隙结晶回来。别在里面待太久。”';
    if (/白塔|失联/.test(text)) return '“有人把它关掉了。别到处问，问多了会有人来找你。”';
    if (/向导|共振|安抚/.test(text)) return '“我不信向导。……但你要是快失控了，我不会拦你去找一个。”';
    if (/裂谷|裂隙/.test(text)) return '“裂谷里没有风。你听见的风声，是你自己的。”';
  }

  if (npc.id === 'echo') {
    if (/安抚|精神|头痛|过载|撑不住/.test(text)) return '“把手给我。别抵抗……我只看裂缝，不往里走。”';
    if (/共振|共鸣/.test(text)) return '“共鸣不是交换。是两个人一起承担。你确定要试吗？”';
    if (/白塔|失联/.test(text)) return '“不是失联。是有人把它关掉了。我听见开关的声音。”';
    if (/名字|你是谁/.test(text)) return '“他们叫我回声。因为我只会重复别人心里的话。”';
  }

  if (/你好|在吗|嗨|早|晚上好/.test(text)) {
    return npc.id === 'yeka' ? '“……嗯。”' : `“${npc.id === 'magpie' ? '来了' : '我在'}。”`;
  }

  if (/信息素|alpha|omega|beta/i.test(text)) {
    return npc.id === 'echo'
      ? '“气味只是表面。真正藏不住的是精神图景里的那道缝。”'
      : '“在这片星区，第二性别没什么用。活下来靠的是别多问。”';
  }

  return pick(npc.lines);
}

function sendChat(raw) {
  if (!S) return;
  const text = String(raw || '').trim();
  if (!text) return;
  const npc = NPCS[ui.chatNpc];
  if (!S.chats[npc.id]) S.chats[npc.id] = [];

  S.chats[npc.id].push({ from: 'me', text });
  addAffinity(npc.id, 1 + (hasTrait('resonance') ? 1 : 0));
  S.chats[npc.id].push({ from: 'npc', text: replyFor(npc, text) });
  if (S.chats[npc.id].length > 60) S.chats[npc.id] = S.chats[npc.id].slice(-60);

  renderSide();
  autosave();
  const input = $('#chat-text');
  if (input) input.focus();
}

function chatAction(actionId) {
  if (!S) return;
  const npc = NPCS[ui.chatNpc];

  if (npc.id === 'magpie') {
    if (actionId === 'discount') {
      if (S.flags.discount) {
        npcSay('magpie', '“已经给你让过价了。别得寸进尺。”');
      } else {
        const res = rollCheck('交涉 · 灰雀', 'soc', 14, traitBonus('social'));
        if (res.success) {
          S.flags.discount = true;
          addAffinity('magpie', 6);
          npcSay('magpie', '“行，八折。就这一次，别带别人来。”');
          addLog('灰雀给了你材料包的折扣价。', 'good');
        } else {
          addAffinity('magpie', -2);
          npcSay('magpie', '“你这张嘴，值不了这个价。”');
        }
      }
    }
    if (actionId === 'buy') {
      const price = S.flags.discount ? 176 : 220;
      if (S.player.credits < price) {
        npcSay('magpie', '“没钱就别浪费我时间。”');
      } else {
        S.player.credits -= price;
        const pool = ['scrap', 'chip', 'ore', 'cold', 'spore', 'resin'];
        const got = {};
        for (let i = 0; i < 3; i++) {
          const k = pick(pool);
          const n = 1 + randInt(2);
          addItem(k, n);
          got[k] = (got[k] || 0) + n;
        }
        addAffinity('magpie', 2);
        npcSay('magpie', '“拿好。别问我从哪来的。”');
        addLog(`从灰雀处购入材料包（-${price} 信用点）：${Object.keys(got).map((k) => `${ITEMS[k].name} ×${got[k]}`).join('、')}。`, 'good');
      }
    }
  }

  if (npc.id === 'yeka') {
    if (actionId === 'quest') {
      if (!S.quest) {
        S.quest = { id: 'shard', name: '裂隙取样', need: { shard: 1 }, reward: 400, giver: 'yeka' };
        addAffinity('yeka', 3);
        npcSay('yeka', '“黑曜裂谷，裂隙边缘。带一块结晶回来，四百点。”');
        addLog('接受委托：裂隙取样（裂隙结晶 ×1）。', 'story');
      } else {
        npcSay('yeka', '“先把手上的事做完。”');
      }
    }
    if (actionId === 'turnin') {
      if (!S.quest) {
        npcSay('yeka', '“我没给你派活。”');
      } else if ((S.inv.shard || 0) < 1) {
        npcSay('yeka', '“东西呢？没有结晶，就没有钱。”');
      } else {
        takeItem('shard', 1);
        S.player.credits += S.quest.reward;
        addAffinity('yeka', 8);
        S.quest = null;
        npcSay('yeka', '“……”她把结晶举到灯下看了一眼，“成色不错。钱转你了。”');
        addLog('委托完成：裂隙取样，+400 信用点。', 'good');
      }
    }
  }

  if (npc.id === 'echo') {
    if (actionId === 'soothe') {
      if (S.player.mental >= S.player.mentalMax) {
        npcSay('echo', '“你现在很稳。……难得。”');
      } else {
        const res = rollCheck('安抚 · 回声', 'psi', 13, roleBoost('psi'));
        if (res.success) {
          const before = S.player.mental;
          S.player.mental = clamp(S.player.mental + 32, 0, S.player.mentalMax);
          addAffinity('echo', 5);
          npcSay('echo', '“好了。裂缝按住了……但它还会再开。”');
          addLog(`精神稳定度 ${Math.round(before)} → ${Math.round(S.player.mental)}。`, 'good');
        } else {
          S.player.mental = clamp(S.player.mental + 10, 0, S.player.mentalMax);
          addAffinity('echo', 2);
          npcSay('echo', '“对不起……我碰不到那道缝。再试一次，好吗？”');
        }
      }
    }
    if (actionId === 'resonate') {
      if (S.location !== 'rift') {
        npcSay('echo', '“远程共振太危险。来裂谷……我在这一侧等你。”');
      } else if (S.player.mental <= 12) {
        npcSay('echo', '“不行。你会碎的。”');
      } else {
        S.player.mental = clamp(S.player.mental - 5, 0, S.player.mentalMax);
        addAffinity('echo', 4);
        npcSay('echo', '你听见很多声音同时说话，然后只剩她的一句：“别松手。”');
        addLog('你与回声完成了一次浅层共振。精神 -5，好感 +4。', 'story');
      }
    }
  }

  renderAll();
  autosave();
}

function buildPrompt(npc) {
  const p = S.player;
  const attrs = ATTRS.map((a) => `${a.name} ${attrTotal(a.key)}`).join(' / ');
  const history = (S.chats[npc.id] || []).slice(-6)
    .map((m) => `${m.from === 'me' ? p.name : npc.name}：${m.text}`)
    .join('\n');

  return `【系统】
你是星际 RPG《星穹哨向》中的 NPC「${npc.name}」（${ABOS[npc.abo].name} / ${npc.title}）。
人格：${npc.persona}
所在：${npc.where}
规则：只输出对白与极简动作描写；不替玩家做决定；不修改任何数值；
      不描写露骨内容；保持冷峻、克制的太空边境语气。

【玩家】
${p.name}｜${ABOS[p.abo].name} ${ROLES[p.role].name}｜出身：${ORIGINS[p.origin].name}
属性：${attrs}
生命：${Math.round(p.hp)}/${p.hpMax}｜精神：${Math.round(p.mental)}/${p.mentalMax}｜信用点：${p.credits}
位置：${MAPS.find((m) => m.id === S.location).name}｜第 ${S.day} 日 ${timeLabel()}
对玩家好感：${S.affinity[npc.id] || 0}/100

【最近对话】
${history || '（无）'}

【玩家输入】
{{player_input}}`;
}

/* ============================================================
 * 15. 星图
 * ========================================================== */
function openMap() {
  if (!S) return;
  $('#overlay').classList.remove('hidden');
  renderMapOverlay();
}

function closeMap() {
  const ov = $('#overlay');
  if (!ov) return;
  ov.classList.add('hidden');
  ov.innerHTML = '';
}

function renderMapOverlay() {
  const ov = $('#overlay');
  if (!ov) return;

  const cards = MAPS.map((m) => {
    const here = m.id === S.location;
    const blocked = S.ap < 1 && m.id !== 'dock';
    const nodes = m.nodes.length;
    const label = here ? '当前位置' : blocked ? '行动点不足' : '移动 AP 1';
    return `
      <button type="button" class="map-card ${here ? 'is-current' : ''}" data-act="travel" data-map="${m.id}"
        style="--accent:${m.accent}" ${here || blocked ? 'disabled' : ''}>
        <span class="map-thumb"><i></i></span>
        <span class="map-info">
          <b>${m.name}</b>
          <span>${m.code} · ${nodes} 个节点 · 危险 ${m.danger || '—'}</span>
        </span>
        <span class="map-meta">
          <b class="${here ? 'cur' : ''}">${label}</b>
          <span>${here ? '已抵达' : '1 AP'}</span>
        </span>
      </button>`;
  }).join('');

  ov.innerHTML = `
    <div class="overlay-panel">
      <div class="overlay-head">
        <div>
          <p class="kicker">NAV-05 · STAR MAP</p>
          <h2>星图</h2>
          <p>选择一个区域。移动消耗 1 行动点，危险区域会额外消耗精神。</p>
        </div>
        <button type="button" class="overlay-close" data-act="close-map" aria-label="关闭">✕</button>
      </div>
      <div class="map-list">${cards}</div>
      <div class="overlay-foot">AP ${S.ap} / ${S.apMax} · 第 ${S.day} 日 ${timeLabel()}</div>
    </div>`;
}

/* ============================================================
 * 16. Toast / 事件
 * ========================================================== */
function toast(msg, kind = '') {
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    el.style.transition = 'opacity .25s ease, transform .25s ease';
    setTimeout(() => el.remove(), 260);
  }, 2200);
}

function onAction(act, el) {
  switch (act) {
    /* 创建 */
    case 'abo': draft.abo = el.dataset.key; renderCreate(); break;
    case 'role': draft.role = el.dataset.key; renderCreate(); break;
    case 'origin': draft.origin = el.dataset.key; renderCreate(); break;
    case 'attr-inc': {
      const k = el.dataset.key;
      if (pointsLeft(draft) > 0 && draft.attrs[k] < ATTR_MAX) {
        draft.attrs[k] += 1;
        renderCreate();
      }
      break;
    }
    case 'attr-dec': {
      const k = el.dataset.key;
      if (draft.attrs[k] > BASE_ATTR) {
        draft.attrs[k] -= 1;
        renderCreate();
      }
      break;
    }
    case 'trait': {
      const k = el.dataset.key;
      const i = draft.traits.indexOf(k);
      if (i >= 0) draft.traits.splice(i, 1);
      else if (draft.traits.length < 2) draft.traits.push(k);
      else return toast('最多选择 2 项特质');
      renderCreate();
      break;
    }
    case 'random-name': {
      draft.name = pick(NAMES);
      const inp = $('#name-input');
      if (inp) inp.value = draft.name;
      break;
    }
    case 'randomize': randomizeBuild(); break;
    case 'next-step': nextStep(); break;
    case 'prev-step': prevStep(); break;
    case 'start': startGame(); break;
    case 'resume': resumeGame(); break;

    /* 游戏 */
    case 'view': setView(el.dataset.view); break;
    case 'mid-tab': ui.midTab = el.dataset.tab; ui.view = ui.midTab; renderBottomNav(); renderMid(); animateView(ui.view); break;
    case 'side-tab': ui.sideTab = el.dataset.tab; renderSide(); break;
    case 'gather': gather(el.dataset.map, el.dataset.node); break;
    case 'travel': travel(el.dataset.map); break;
    case 'rest': rest(); break;
    case 'craft': craft(el.dataset.id); break;
    case 'equip': toggleEquip(el.dataset.uid); break;
    case 'use': useItem(el.dataset.key); break;
    case 'chat-npc': ui.chatNpc = el.dataset.id; renderSide(); break;
    case 'chat-act': chatAction(el.dataset.id); break;
    case 'send-chat': {
      const input = $('#chat-text');
      sendChat(input ? input.value : '');
      break;
    }
    case 'open-map': openMap(); break;
    case 'close-map': closeMap(); break;
    case 'save': saveGame(); break;
    case 'menu': showCreate(); break;
    default: break;
  }
}

function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    onAction(el.dataset.act, el);
  });

  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'name-input') {
      draft.name = e.target.value;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'chat-text' && e.key === 'Enter') {
      e.preventDefault();
      sendChat(e.target.value);
    }
    if (e.key === 'Escape') {
      if (!$('#overlay').classList.contains('hidden')) closeMap();
    }
  });

  const ov = $('#overlay');
  if (ov) {
    ov.addEventListener('click', (e) => {
      if (e.target === ov) closeMap();
    });
  }
}

/* ============================================================
 * 17. 启动
 * ========================================================== */
function init() {
  draft = newDraft();
  bindEvents();
  showCreate();
}

init();
</script>
