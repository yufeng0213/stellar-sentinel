services:
  stellar-sentinel:
    build: .
    image: stellar-sentinel:latest
    container_name: stellar-sentinel
    restart: unless-stopped
    init: true
    environment:
      PORT: 3003
      BASE_PATH: /stellar-sentinel
      DATA_DIR: /data
      TZ: Asia/Shanghai
    ports:
      - "3003:3003"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
